[project]
name = "demon-cry-python-sdk"
dynamic = ["version"]
description = ""
authors = [
    {name = "Fazzyt"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]

[tool.poetry]
version = "0.0.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"
pattern = "^v(?P<base>\\d+\\.\\d+\\.\\d+)(-(?P<stage>[a-zA-Z]+)\\.?(?P<revision>\\d+))?$"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
[dependency-groups]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)"
]
